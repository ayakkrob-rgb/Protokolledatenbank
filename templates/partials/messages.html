{% load ui %}{% if messages %}
<div class="messages" role="status">
  {% for message in messages %}
  <div class="alert alert-{{ message.tags|default:'info' }}">
    {% if message.tags == "success" %}{% icon "check" %}{% elif message.tags == "error" %}{% icon "alert" %}{% elif message.tags == "warning" %}{% icon "alert" %}{% else %}{% icon "info" %}{% endif %}
    <div>{{ message }}</div>
  </div>
  {% endfor %}
</div>
{% endif %}
